/* ═══ NIGHT DRIVE ═══ A committed single-theme surface: this is a game that
   takes place after dark, so every colour is painted explicitly and the page
   holds its look on any host background.                                  */
:root{
  --road-0:#070A10; --road-1:#0F151F; --road-2:#161E2B; --road-3:#1F2937;
  --hair:#26313F; --hair-hot:#3A4759;
  --ink:#E9EFF7; --ink-2:#93A2B8; --ink-3:#63728A;
  --beam:#FFB020; --beam-hot:#FFD24A; --beam-dim:#7A5A16;
  --good:#2FD07C; --good-dim:#12351F; --bad:#FF5A5F; --bad-dim:#3A1417;
  --sign-red:#C8102E; --sign-green:#00693E; --sign-blue:#0057B8;
  --r:14px; --r-s:10px;
  --pad:clamp(14px,4vw,22px);
  --f-disp:'Barlow Condensed',Impact,'Haettenschweiler','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-sign:'Overpass','Arial Narrow',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--road-0); color:var(--ink);
  font-family:var(--f-body); font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* faint asphalt grain + a cold pool of light at the top of the screen */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(255,176,32,.10), transparent 60%),
    radial-gradient(90% 50% at 50% 105%, rgba(50,90,160,.08), transparent 70%);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--beam);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-family:var(--f-disp);font-weight:800;line-height:1;letter-spacing:.01em;text-wrap:balance;text-transform:uppercase}
p{margin:0}
.app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:0 var(--pad) 96px;min-height:100vh}
.num{font-variant-numeric:tabular-nums}

/* ── HUD ─────────────────────────────────────────────────────────────── */
.hud{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:12px 0 10px;background:linear-gradient(var(--road-0) 72%,rgba(7,10,16,0));}
.hud .back{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;
  background:var(--road-2);border:1px solid var(--hair);font-weight:600;font-size:14px;color:var(--ink-2)}
.hud .back:hover{background:var(--road-3);color:var(--ink)}
.hud .title{font-family:var(--f-disp);font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud .chip{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:99px;background:var(--road-2);
  border:1px solid var(--hair);font-family:var(--f-disp);font-weight:800;font-size:17px;letter-spacing:.03em}
.hud .chip.xp{color:var(--beam);border-color:var(--beam-dim)}

/* ── wordmark ────────────────────────────────────────────────────────── */
.mark{display:flex;align-items:baseline;gap:10px;padding:6px 0 2px}
.mark .g1{font-family:var(--f-disp);font-weight:800;font-size:clamp(40px,13vw,62px);line-height:.82;
  letter-spacing:-.01em;color:var(--ink);text-transform:uppercase}
.mark .g1 em{font-style:normal;color:var(--beam);text-shadow:0 0 28px rgba(255,176,32,.45)}
.mark .sub{font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.22em;color:var(--ink-3);text-transform:uppercase}

.realtest{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin:10px 0 4px;padding:11px 14px;
  border-radius:var(--r-s);background:var(--road-1);border:1px solid var(--hair);border-left:3px solid var(--beam);font-size:14px;color:var(--ink-2)}
.realtest b{font-family:var(--f-disp);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--beam);font-weight:800}
.realtest span b{color:var(--ink);font-family:var(--f-body);font-size:14px;letter-spacing:0;text-transform:none}

/* ── panels ──────────────────────────────────────────────────────────── */
.panel{background:var(--road-1);border:1px solid var(--hair);border-radius:var(--r);padding:16px}
.panel + .panel{margin-top:12px}
.sec{margin-top:26px}
.sec > h2{font-size:15px;letter-spacing:.16em;color:var(--ink-3);margin-bottom:10px}

/* ── readiness gauge ─────────────────────────────────────────────────── */
.gauge{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.gauge svg{flex:0 0 auto}
.gauge .read{flex:1;min-width:180px}
.gauge .pct{font-family:var(--f-disp);font-size:54px;font-weight:800;line-height:.9;color:var(--beam)}
.gauge .lbl{font-family:var(--f-disp);font-size:13px;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase}
.gauge .note{font-size:14px;color:var(--ink-2);margin-top:8px}

.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px;margin-top:14px}
.stat{background:var(--road-2);border:1px solid var(--hair);border-radius:var(--r-s);padding:9px 10px;text-align:center}
.stat b{display:block;font-family:var(--f-disp);font-size:26px;font-weight:800;line-height:1;color:var(--ink)}
.stat span{font-size:11px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}

/* ── game cards: lit like retroreflective sign faces ─────────────────── */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.gcard{position:relative;overflow:hidden;text-align:left;padding:14px;border-radius:var(--r);
  background:var(--road-1);border:1px solid var(--hair);transition:transform .16s,border-color .16s,background .16s}
.gcard::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.055) 0%,transparent 42%)}
.gcard:hover,.gcard:focus-visible{transform:translateY(-2px);border-color:var(--hair-hot);background:var(--road-2)}
.gcard .ic{display:block;margin-bottom:9px}
.gcard b{display:block;font-family:var(--f-disp);font-size:21px;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.gcard small{display:block;color:var(--ink-2);font-size:13px;line-height:1.3;margin-top:2px}
.gcard .best{margin-top:9px;font-family:var(--f-disp);font-size:13px;letter-spacing:.1em;color:var(--beam);text-transform:uppercase}
.gcard.wide{grid-column:1/-1}
.gcard.exam{border-color:var(--beam-dim);background:linear-gradient(150deg,#1B160B,var(--road-1) 55%)}
.gcard.review{border-color:#3A2A2C;background:linear-gradient(150deg,#1D1214,var(--road-1) 55%)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-family:var(--f-disp);font-size:12px;
  font-weight:800;letter-spacing:.08em;text-transform:uppercase;vertical-align:2px}
.pill.hot{background:var(--bad);color:#fff}
.pill.ok{background:var(--good-dim);color:var(--good);border:1px solid #1E5C39}

/* ── the stage: a sign in a headlight cone ───────────────────────────── */
.stage{position:relative;display:grid;place-items:center;min-height:min(46vh,300px);margin:6px 0 14px;padding:16px 12px 54px;
  border-radius:var(--r);background:linear-gradient(180deg,#0B1119,#121A25 78%,#0A0E15);
  border:1px solid var(--hair);overflow:hidden}
.stage.text{min-height:0;padding:30px 16px 46px}
.stage .beam{position:absolute;left:50%;top:-14%;width:150%;height:130%;transform:translateX(-50%);
  background:radial-gradient(ellipse 42% 46% at 50% 46%,rgba(255,196,90,.20),rgba(255,176,32,.07) 45%,transparent 72%);
  pointer-events:none}
.stage .road{position:absolute;left:0;right:0;bottom:0;height:44px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.55)),
             repeating-linear-gradient(90deg,var(--hair) 0 26px,transparent 26px 52px);
  background-size:auto,52px 3px;background-position:0 0,0 22px;background-repeat:repeat,repeat-x;opacity:.55}
.stage .signwrap{position:relative;z-index:2;animation:arrive .34s cubic-bezier(.2,.9,.3,1.2) both;
  filter:drop-shadow(0 10px 26px rgba(0,0,0,.6))}
@keyframes arrive{from{opacity:0;transform:scale(.82) translateY(10px)}to{opacity:1;transform:none}}
.stage .prompt{position:relative;z-index:2;padding:18px;text-align:center;font-size:clamp(17px,4.6vw,21px);
  font-weight:500;line-height:1.35;max-width:34ch}
.stage .prompt .k{color:var(--beam);font-weight:600}

/* ── answers ─────────────────────────────────────────────────────────── */
.answers{display:grid;gap:9px}
.answers.two{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ans{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:14px 15px;border-radius:var(--r-s);background:var(--road-2);border:1px solid var(--hair);
  font-size:16px;line-height:1.3;transition:background .12s,border-color .12s,transform .12s}
.ans:hover:not(:disabled){background:var(--road-3);border-color:var(--hair-hot)}
.ans:disabled{cursor:default}
.ans .key{flex:0 0 30px;height:30px;display:grid;place-items:center;border-radius:8px;background:var(--road-0);
  border:1px solid var(--hair);font-family:var(--f-disp);font-weight:800;font-size:16px;color:var(--ink-3)}
.ans.right{background:var(--good-dim);border-color:var(--good);color:#D9FFE9}
.ans.right .key{background:var(--good);border-color:var(--good);color:#08210F}
.ans.wrong{background:var(--bad-dim);border-color:var(--bad);color:#FFE2E3;animation:shake .3s}
.ans.wrong .key{background:var(--bad);border-color:var(--bad);color:#2A0508}
.ans.faded{opacity:.42}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}

/* ── feedback drawer ─────────────────────────────────────────────────── */
.why{margin-top:11px;padding:13px 15px;border-radius:var(--r-s);border:1px solid var(--hair);
  background:var(--road-1);animation:rise .22s ease both}
.why b{display:block;font-family:var(--f-disp);font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.why.right b{color:var(--good)} .why.wrong b{color:var(--bad)}
.why p{font-size:15px;color:var(--ink-2)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── metering: lane dashes ───────────────────────────────────────────── */
.meter{display:flex;gap:4px;align-items:center;margin:2px 0 10px}
.meter i{flex:1;height:6px;border-radius:2px;background:var(--road-3);transition:background .2s}
.meter i.on{background:var(--beam);box-shadow:0 0 10px rgba(255,176,32,.5)}
.meter i.miss{background:var(--bad)}
.timer{height:6px;border-radius:99px;background:var(--road-3);overflow:hidden;margin-bottom:12px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--beam),var(--beam-hot));
  transition:width .95s linear}
.timer.low i{background:linear-gradient(90deg,#FF7A45,var(--bad))}
.playbar{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-family:var(--f-disp);
  font-size:17px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.playbar .score{margin-left:auto;color:var(--beam);font-size:24px}
.playbar .combo{color:var(--beam-hot)}

/* ── floating score pops ─────────────────────────────────────────────── */
.pop{position:fixed;z-index:60;pointer-events:none;font-family:var(--f-disp);font-weight:800;font-size:30px;
  color:var(--beam-hot);text-shadow:0 2px 14px rgba(0,0,0,.7);animation:pop 1s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.06)}
100%{opacity:0;transform:translate(-50%,-64px) scale(1)}}

/* ── results ─────────────────────────────────────────────────────────── */
.result{text-align:center;padding:26px 18px}
.result .big{font-family:var(--f-disp);font-size:clamp(58px,19vw,92px);font-weight:800;line-height:.86;color:var(--beam)}
.result .verdict{font-family:var(--f-disp);font-size:26px;letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.result .verdict.pass{color:var(--good)} .result .verdict.fail{color:var(--bad)}
.result p{color:var(--ink-2);margin-top:8px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.btn{padding:13px 20px;border-radius:99px;background:var(--road-2);border:1px solid var(--hair);
  font-family:var(--f-disp);font-size:18px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.btn:hover{background:var(--road-3);border-color:var(--hair-hot)}
.btn.go{background:var(--beam);color:#1A1204;border-color:var(--beam)}
.btn.go:hover{background:var(--beam-hot)}
.btn.wide{width:100%}

.scorecard{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.scorecard .half{background:var(--road-2);border:1px solid var(--hair);border-radius:var(--r-s);padding:14px;text-align:center}
.scorecard .half b{display:block;font-family:var(--f-disp);font-size:38px;font-weight:800;line-height:1}
.scorecard .half.pass b{color:var(--good)} .scorecard .half.fail b{color:var(--bad)}
.scorecard .half span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

/* ── lists ───────────────────────────────────────────────────────────── */
.rows{display:grid;gap:7px}
.row{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:var(--r-s);
  background:var(--road-1);border:1px solid var(--hair);text-align:left;width:100%}
.row:hover{background:var(--road-2)}
.row .nm{flex:1;min-width:0;font-weight:500;font-size:15px}
.row .nm small{display:block;color:var(--ink-3);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.bar{flex:0 0 78px;height:7px;border-radius:99px;background:var(--road-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--beam)}
.bar.good i{background:var(--good)} .bar.bad i{background:var(--bad)}
.row .pc{flex:0 0 42px;text-align:right;font-family:var(--f-disp);font-weight:800;font-size:18px;color:var(--ink-2)}

.row.miss{align-items:flex-start;gap:12px}
.row.miss .thumb{flex:0 0 46px;line-height:0;padding-top:2px}
.row.miss .nm b{display:block;font-weight:600;font-size:15px;color:var(--ink);margin-bottom:2px;letter-spacing:0;text-transform:none}
.row.miss .nm em{display:block;font-style:normal;font-size:14px;color:var(--good);margin-bottom:3px}
.row.miss .nm small{display:block;font-size:13px;color:var(--ink-3);letter-spacing:0;text-transform:none;line-height:1.4}
.answers.two .ans > span:last-child{flex:1;display:grid;place-items:center}
.kbhint{display:none;margin-top:9px;text-align:center;font-family:var(--f-disp);font-size:13px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
@media (pointer:fine){.kbhint{display:block}}

/* ── study sheets ────────────────────────────────────────────────────── */
.sheet{background:var(--road-1);border:1px solid var(--hair);border-left:3px solid var(--beam);
  border-radius:var(--r);padding:15px 16px}
.sheet + .sheet{margin-top:10px}
.sheet h3{font-size:19px;margin-bottom:9px}
.sheet ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.sheet li{position:relative;padding-left:18px;font-size:15px;color:var(--ink-2);line-height:1.4}
.sheet li::before{content:'';position:absolute;left:0;top:.62em;width:8px;height:2px;background:var(--beam);border-radius:2px}

/* ── sign browser ────────────────────────────────────────────────────── */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;padding:8px 14px;border-radius:99px;background:var(--road-1);border:1px solid var(--hair);
  font-family:var(--f-disp);font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.tab[aria-selected=true]{background:var(--beam);border-color:var(--beam);color:#1A1204}
.signgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.sgi{padding:10px 8px;border-radius:var(--r-s);background:var(--road-1);border:1px solid var(--hair);text-align:center}
.sgi:hover{background:var(--road-2);border-color:var(--hair-hot)}
.sgi{position:relative}
.sgi.seen::after{content:'';position:absolute;top:7px;right:7px;width:14px;height:14px;border-radius:50%;
  background:var(--good);box-shadow:inset 0 0 0 2px var(--road-1)}
.sgi.seen::before{content:'';position:absolute;top:11px;right:10px;width:7px;height:4px;z-index:1;
  border-left:2px solid var(--road-1);border-bottom:2px solid var(--road-1);transform:rotate(-45deg)}
.sgi svg{display:block;margin:0 auto 7px}
.sgi span{display:block;font-size:12px;line-height:1.25;color:var(--ink-2)}
.detail{display:grid;place-items:center;gap:12px;text-align:center;padding:8px 0 4px}
.detail .meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tagx{padding:3px 10px;border-radius:99px;background:var(--road-2);border:1px solid var(--hair);
  font-family:var(--f-disp);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}

/* ── plan-view intersection ──────────────────────────────────────────── */
.plan{display:block;margin:0 auto;max-width:100%;height:auto}

/* a flashing green is the whole point of the advanced-green diagram, so the
   halo pulses; the lamp underneath stays lit if motion is reduced */
@keyframes sigflash{0%,48%{opacity:.34}49%,100%{opacity:.05}}
.plan .sigflash{animation:sigflash 1.1s steps(1,end) infinite}

/* ── misc ────────────────────────────────────────────────────────────── */
.empty{text-align:center;padding:34px 18px;color:var(--ink-2)}
.empty b{display:block;font-family:var(--f-disp);font-size:26px;color:var(--ink);margin-bottom:6px;text-transform:uppercase}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.bdg{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:99px;background:var(--road-1);
  border:1px solid var(--hair);font-size:14px;color:var(--ink-3)}
.bdg.got{border-color:var(--beam-dim);color:var(--ink);background:linear-gradient(120deg,#1B160B,var(--road-1))}
.bdg .e{font-size:17px;filter:grayscale(1) opacity(.5)}
.bdg.got .e{filter:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;padding:12px 18px;border-radius:99px;
  background:var(--beam);color:#1A1204;font-family:var(--f-disp);font-weight:800;font-size:17px;letter-spacing:.04em;
  text-transform:uppercase;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:toast 2.6s ease both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,16px)}10%,86%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--hair);font-size:13px;color:var(--ink-3);line-height:1.55}
.foot a{color:var(--ink-2)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

  const lab = opts.hideLabel ? 'true' : 'false';
  return `<svg viewBox="0 0 128 128" width="${size}" height="${size}"${cls} role="img" aria-hidden="${lab}"${opts.hideLabel?'':` aria-label="${esc(sign.name)}"`}>${body}</svg>`;
}

    const bx = C+26, by = sc.median ? 150 : 118;
    s += '<g transform="translate('+bx+','+by+') rotate(-90) scale(.55) translate(-50,-50)" fill="#FFCE00" style="--cut:#0B1119">'+G.schoolBus+'</g>';
    s += '<circle cx="'+(bx-16)+'" cy="'+(by-26)+'" r="6" fill="#FF5A5F"/><circle cx="'+(bx+16)+'" cy="'+(by-26)+'" r="6" fill="#FF5A5F"/>';
    s += '<circle cx="'+(bx-16)+'" cy="'+(by+26)+'" r="6" fill="#FF5A5F"/><circle cx="'+(bx+16)+'" cy="'+(by+26)+'" r="6" fill="#FF5A5F"/>';
    /* stop arm swung out into the lane beside it */
    s += '<rect x="'+(bx-46)+'" y="'+(by-9)+'" width="22" height="18" rx="3" fill="#C8102E" stroke="#fff" stroke-width="2"/>';
  }
  if(kind==="emergency"){
    /* drawn as a plan-view vehicle like every other car — the side-view car
       glyph turned on its side just read as a white wedge */
    const ex = C+26, ey = 258;
    s += car(ex, ey, 0, "#EDF2F8", false);
    s += '<rect x="'+(ex-15)+'" y="'+(ey-7)+'" width="30" height="9" rx="4" fill="#0B1119"/>';
    s += '<circle cx="'+(ex-7)+'" cy="'+(ey-2.5)+'" r="4.5" fill="#FF5A5F"/>';
    s += '<circle cx="'+(ex+7)+'" cy="'+(ey-2.5)+'" r="4.5" fill="#4EA8FF"/>';
    s += cap(ex, 296, "AMBULANCE", "#93A2B8", 12);
  }
  /* cars */
  /* the queue is the whole point of the blocked-intersection question */
  if(sc.queue){
    [150, 98, 46].forEach(y => { s += car(C+18, y, 0, OTHER, false); });
  }
  const oneRoad = (kind==="schoolbus" || kind==="emergency");
  const spots = oneRoad
    ? { s:[C+26,204,0], n:[C-30,68,180] }
    : { s:[C+18,244,0], n:[C-18,56,180], w:[56,C+18,90], e:[244,C-18,270] };
  (sc.cars||[]).forEach(c=>{
    const p = spots[c.leg]; if(!p) return;
    s += car(p[0], p[1], p[2], c.you ? "#4EA8FF" : OTHER, !!c.you);
  });
  s += '</svg>';
  return s;
}
function scenarioQuestion(i){
  const sc = SCENARIOS[i]; const order = shuffle([0,1,2,3]);
  return { stage:'<div class="signwrap">'+planSVG(sc)+'</div><p class="prompt">'+esc2(sc.q)+"</p>",
    prompt:"", opts: order.map(k=>esc2(sc.a[k])), c: order.indexOf(sc.c), why:sc.w,
    ref:"r:"+sc.id, area:{store:"topic",id:sc.t||"intersections"} };
}

/* rebuild any question from its stored key (used by the Fix-It list) */
function fromRef(ref){
  const k = ref.slice(0,1), v = ref.slice(2);
  if(k==="q") return ruleQuestion(+v);
  if(k==="n") return numberQuestion(+v);
  if(k==="c") return decoderQuestion(+v);
  if(k==="r"){ const i=SCENARIOS.findIndex(s=>s.id===v); return i<0?null:scenarioQuestion(i); }
  if(k==="s"){ const s=SIGNS.find(x=>x.id===v); return s?signQuestion(s):null; }
  return null;
}
window.__G1 = {S, readiness};   /* handy in the console, harmless in play */

/* one row of the "what you missed" lists: the sign or the question, the right
   answer, and why — so a wrong answer teaches something on the spot */
function missRow(ref, why, extra){
  const k = ref ? ref[0] : "";
  let thumb="", title="", answer="";
  if(k==="s"){ const s=SIGNS.find(y=>y.id===ref.slice(2));
    if(s){ thumb=signSVG(s,46,{hideLabel:true}); title=s.name; answer=s.means; } }
  else if(k==="q"){ const b=BANK[+ref.slice(2)]; if(b){ title=b.q; answer=b.a[b.c]; } }
  else if(k==="n"){ const n=NUMBERS[+ref.slice(2)]; if(n){ title=n.q; answer=(n.u==="$"?"$"+n.v.toLocaleString():n.v+" "+n.u); } }
  else if(k==="r"){ const s=SCENARIOS.find(y=>y.id===ref.slice(2)); if(s){ title=s.q; answer=s.a[s.c]; } }
  else if(k==="c"){ const d=DECODER[+ref.slice(2)]; if(d){ title=d.q; answer=d.a[d.c]; } }
  const el = h("div",{class:"row miss"});
  el.innerHTML = (thumb ? '<span class="thumb">'+thumb+"</span>" : "")+
    '<div class="nm"><b>'+esc2(title)+"</b><em>"+esc2(answer)+"</em>"+
    (why ? "<small>"+esc2(why)+"</small>" : "")+"</div>"+(extra||"");
  return el;
}

let activeTimer = null;
function stopTimers(){ if(activeTimer){ clearInterval(activeTimer); activeTimer=null; } }

function play(cfg){
  stopTimers();
  const app = $("#app");
  let i=0, score=0, combo=0, bestCombo=0, right=0, answered=false, log=[];
  let left = cfg.seconds || 0;
  const total = cfg.questions ? cfg.questions.length : 0;

  app.innerHTML = "";
  app.appendChild(hudBar(cfg.title, true));
  const bar   = h("div",{class:"playbar"});
  const timer = h("div",{class:"timer"},[h("i")]);
  const meter = h("div",{class:"meter"});
  const stage = h("div",{class:"stage"});
  const ansEl = h("div",{class:"answers"});
  const whyEl = h("div");
  app.appendChild(bar);
  if(cfg.seconds) app.appendChild(timer);
  if(total && total<=24) app.appendChild(meter);
  app.appendChild(stage); app.appendChild(ansEl);
  app.appendChild(h("div",{class:"kbhint",text:"Keys 1\u20134 or A\u2013D"}));
  app.appendChild(whyEl);

  if(total<=24) for(let k=0;k<total;k++) meter.appendChild(h("i"));

  function paintBar(){
    const bits = [];
    const cq = cfg.questions ? cfg.questions[Math.min(i,total-1)] : null;
    if(cq && cq.half){ bits.push("<span>"+cq.half.toUpperCase()+" "+(cq.half==="signs"?i+1:i-19)+" / 20</span>"); }
    else if(total) bits.push('<span>'+(Math.min(i+1,total))+" / "+total+"</span>");
    else bits.push("<span>Signs</span>");
    if(cfg.combo && combo>1) bits.push('<span class="combo">&times;'+comboMult()+" streak "+combo+"</span>");
    bar.innerHTML = bits.join(" ")+'<span class="score num">'+score+"</span>";
  }
  const comboMult = () => Math.min(5, 1+Math.floor(combo/4));

  if(cfg.seconds){
    activeTimer = setInterval(()=>{
      left--; const pct = Math.max(0,left/cfg.seconds*100);
      timer.firstChild.style.width = pct+"%";
      timer.classList.toggle("low", left<=10);
      if(left<=0){ stopTimers(); finish(); }
    },1000);
    timer.firstChild.style.width = "100%";
  }

  function nextQ(){
    answered=false; whyEl.innerHTML="";
    const q = cfg.questions ? cfg.questions[i] : cfg.next(i);
    if(!q){ finish(); return; }
    if(cfg.questions && i>=total){ finish(); return; }
    stage.className = "stage" + (q.stage.indexOf("signwrap")<0 ? " text" : "");
    stage.innerHTML = '<div class="beam"></div><div class="road"></div>'+q.stage;
    ansEl.className = "answers" + (q.optHtml ? " two" : "");
    ansEl.innerHTML = "";
    q.opts.forEach((o,k)=>{
      const b = h("button",{class:"ans", type:"button"});
      b.innerHTML = '<span class="key">'+"ABCD"[k]+"</span><span>"+o+"</span>";
      b.addEventListener("click", ev=>answer(q,k,b,ev));
      ansEl.appendChild(b);
    });
    paintBar();
  }

  function answer(q, k, btn, ev){
    if(answered) return; answered=true;
    const ok = k===q.c;
    const kids = Array.prototype.slice.call(ansEl.children);
    kids.forEach((el,n)=>{ el.disabled=true;
      if(n===q.c) el.classList.add("right");
      else if(n===k) el.classList.add("wrong");
      else el.classList.add("faded"); });

    /* progress bookkeeping */
    if(q.area){ record(q.area.store==="topic"?S.topic:S.signcat, q.area.id, ok); }
    if(q.ref && q.ref[0]==="s") record(S.sign, q.ref.slice(2), ok);
    if(ok){ right++; combo++; bestCombo=Math.max(bestCombo,combo); clearMiss(q.ref, true); }
    else  { combo=0; addMiss(q.ref); }
    log.push({ref:q.ref, ok:ok, q:q});

    let gained = 0;
    if(ok){
      gained = cfg.combo ? 100*comboMult() : 100;
      score += gained;
      if(cfg.seconds){ left = Math.min(cfg.seconds, left+2); }
      if(ev && ev.clientX) popScore("+"+gained, ev.clientX, ev.clientY-20);
    } else if(cfg.seconds){ left = Math.max(1, left-3); }
    if(total && total<=24 && meter.children[i]) meter.children[i].className = ok?"on":"miss";
    paintBar();

    if(cfg.silent){ i++; setTimeout(nextQ, 140); return; }
    if(cfg.fast){
      if(!ok){
        whyEl.innerHTML = '<div class="why wrong"><b>'+esc2(q.opts[q.c].replace(/<[^>]+>/g,"")||"Answer")+"</b><p>"+esc2(q.why)+"</p></div>";
        i++; setTimeout(nextQ, 2100);
      } else { i++; setTimeout(nextQ, 520); }
      return;
    }
    const box = h("div",{class:"why "+(ok?"right":"wrong")});
    box.innerHTML = "<b>"+(ok?"Correct":"Not quite")+"</b><p>"+esc2(q.why)+"</p>";
    const nb = h("button",{class:"btn go wide", type:"button", text: (total && i>=total-1) ? "See results" : "Next"});
    nb.addEventListener("click", ()=>{ i++; nextQ(); });
    box.appendChild(h("div",{class:"btnrow"},[nb]));
    whyEl.appendChild(box);
    nb.focus({preventScroll:true});
  }

  function finish(){
    stopTimers();
    S.plays++; markDay();
    const asked = log.length;
    const acc = asked ? right/asked : 0;
    const xp = Math.round(score/10) + right*4 + (cfg.mode==="exam" ? 0 : 0);
    addXp(xp);
    if(cfg.mode){
      const prev = S.best[cfg.mode]||0;
      if(score>prev){ S.best[cfg.mode]=score; }
    }
    if(cfg.mode==="sprint"){ if(bestCombo>=10) grant("streak10"); if(bestCombo>=20) grant("streak20"); }
    if(cfg.mode==="row" && asked && right===asked) grant("row");
    if(cfg.mode==="dial" && asked && right===asked) grant("dial");
    if(cfg.mode==="decoder" && asked && right===asked) grant("decoder");
    if(cfg.mode==="ladder" && acc>=0.8) grant("ladder");
    if(cfg.mode==="review" && missCount()===0) grant("clean");
    checkBadges(); save();
    if(cfg.onDone) cfg.onDone({score, right, asked, acc, bestCombo, xp, log});
    else results({score, right, asked, acc, bestCombo, xp, log, title:cfg.title, again:cfg.again});
  }

  document.onkeydown = function(e){
    if(answered || !ansEl.children.length) return;
    const map = {"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
    const k = map[e.key.toLowerCase()];
    if(k!=null && ansEl.children[k]){ e.preventDefault(); ansEl.children[k].click(); }
  };
  nextQ();
}

/* ═══ WEIGHTED PICKING — practise what you are worst at ═════════════════ */
function weightedSigns(n){
  const scored = SIGNS.map(s=>{
    const b = S.sign[s.id];
    const acc = (b && b.n) ? b.r/b.n : null;
    let w = acc===null ? 1.15 : (1-acc)*1.9 + 0.15;
    if(S.miss["s:"+s.id]) w += 1.4;
    return {s, w: w + Math.random()*0.75};
  });
  scored.sort((a,b)=>b.w-a.w);
  return shuffle(scored.slice(0, Math.min(SIGNS.length, Math.max(n*2, n+10)))).slice(0,n).map(x=>x.s);
}
function ruleIndexes(){ return BANK.map((q,i)=>i); }
function weightedRules(n, topic){
  let idx = ruleIndexes();
  if(topic) idx = idx.filter(i=>BANK[i].t===topic);
  const scored = idx.map(i=>{
    const b = S.topic[BANK[i].t];
    const acc = (b && b.hist.length) ? accuracy(b) : null;
    let w = acc===null ? 1.1 : (1-acc)*1.6 + 0.2;
    if(S.miss["q:"+i]) w += 1.5;
    return {i, w: w + Math.random()*0.9};
  });
  scored.sort((a,b)=>b.w-a.w);
  return shuffle(scored.slice(0, Math.min(idx.length, Math.max(n*2, n+10)))).slice(0,n).map(x=>x.i);
}
/* exam rules must span the whole book, not just your weak spots */
function examRules(n){
  const byTopic = {}; TOPICS.forEach(t=>byTopic[t.id]=[]);
  BANK.forEach((q,i)=>{ if(byTopic[q.t]) byTopic[q.t].push(i); });
  const keys = shuffle(TOPICS.map(t=>t.id)), out=[]; let guard=0;
  while(out.length<n && guard++<400){
    for(const k of keys){
      const arr = byTopic[k];
      if(!arr.length) continue;
      const j = Math.floor(Math.random()*arr.length);
      const v = arr.splice(j,1)[0];
      if(out.indexOf(v)<0) out.push(v);
      if(out.length>=n) break;
    }
  }
  return shuffle(out);
}

function reviewView(){

  const sec = h("div",{class:"sec"});
  sec.appendChild(h("h2",{text:"On the list ("+keys.length+")"}));
  const rows = h("div",{class:"rows"});
  keys.map(k=>({k, m:S.miss[k]})).sort((a,b)=>b.m.wrong-a.m.wrong).forEach(o=>{
    const q = fromRef(o.k); if(!q) return;
    const need = ["3 correct to clear","2 more to clear","1 more to clear"][Math.min(2,o.m.box)];
    rows.appendChild(missRow(o.k, "Missed "+o.m.wrong+"\u00d7 \u00b7 "+need,
      '<span class="pill '+(o.m.wrong>2?"hot":"ok")+'">'+o.m.box+"/3</span>"));
  });
  sec.appendChild(rows); app.appendChild(sec);
  window.scrollTo(0,0);
}

/* ── Pit Stop: the whole two chapters in bites ───────────────────────── */
function studyView(topicId){
  stopTimers(); document.onkeydown=null;
  const app=$("#app"); app.innerHTML="";
  app.appendChild(hudBar("Pit Stop"));
  const cur = topicId || TOPICS[0].id;
  const tabs = h("div",{class:"tabs",role:"tablist"});

    const b=h("button",{class:"tab",type:"button",role:"tab",text:t.name});
    b.setAttribute("aria-selected", t.id===cur ? "true":"false");

  });
  app.appendChild(tabs);
  const t = TOPICS.find(x=>x.id===cur);
  const head = h("div",{class:"panel"});

    (b&&b.n ? " &middot; you are at "+Math.round(accuracy(b)*100)+"% here" : "")+"</p>";
  const drill = h("button",{class:"btn go wide",type:"button",text:"Drill this topic"});
  drill.addEventListener("click",()=>startRapid(cur));
  head.appendChild(h("div",{class:"btnrow"},[drill]));

  const wrap = h("div",{class:"sec"});
  CARDS.filter(c=>c.t===cur).forEach(c=>{

    s.innerHTML = "<h3>"+esc2(c.title)+"</h3><ul>"+c.lines.map(l=>"<li>"+esc2(l)+"</li>").join("")+"</ul>";
    wrap.appendChild(s);
  });
  app.appendChild(wrap);
  window.scrollTo(0,0);
}

/* ── Sign Shop: browse all 108 ───────────────────────────────────────── */
function signsView(cat, openId){
  stopTimers(); document.onkeydown=null;
  const app=$("#app"); app.innerHTML="";
  app.appendChild(hudBar("Sign Shop"));
  const cur = cat || "reg";
  const tabs = h("div",{class:"tabs",role:"tablist"});
  CAT_ORDER.forEach(c=>{
    const b=h("button",{class:"tab",type:"button",role:"tab",text:SIGN_CATS[c].label});
    b.setAttribute("aria-selected", c===cur?"true":"false");
    b.addEventListener("click",()=>signsView(c));
    tabs.appendChild(b);
  });
  app.appendChild(tabs);
  const fam = SIGNS.filter(s=>s.cat===cur);
  const famSeen = fam.filter(s=>S.sign[s.id] && S.sign[s.id].n>0).length;
  const info = h("div",{class:"panel"});
  info.innerHTML = "<h2 style=\"font-size:20px\">"+esc2(SIGN_CATS[cur].label)+"</h2>"+
    '<p style="color:var(--ink-2);margin-top:4px">'+esc2(SIGN_CATS[cur].blurb)+" &middot; "+esc2(SIGN_CATS[cur].colour)+"</p>"+
    '<p style="color:var(--ink-3);margin-top:6px;font-size:14px">Tested on <b style="color:var(--beam)">'+
    famSeen+" of "+fam.length+"</b> of these. A tick means it has come up at least once.</p>";
  app.appendChild(info);

  const detail = h("div",{class:"panel hide"});
  app.appendChild(detail);
  function open(s){
    const b = S.sign[s.id];
    detail.className = "panel";
    detail.innerHTML = '<div class="detail">'+signSVG(s,150)+
      "<h3 style=\"font-size:22px\">"+esc2(s.name)+"</h3>"+
      '<p style="color:var(--ink)">'+esc2(s.means)+"</p>"+
      '<p style="color:var(--ink-2);font-size:14px">'+esc2(s.tip)+"</p>"+
      '<div class="meta"><span class="tagx">'+esc2(SIGN_CATS[s.cat].label)+'</span><span class="tagx">'+
      esc2(s.shape)+'</span>'+(b&&b.n?'<span class="tagx">you: '+b.r+"/"+b.n+"</span>":"")+"</div></div>";
    detail.scrollIntoView({block:"nearest", behavior:"smooth"});
  }
  const grid = h("div",{class:"signgrid"});
  fam.forEach(s=>{
    const b = S.sign[s.id];
    const c=h("button",{class:"sgi"+(b&&b.n?" seen":""),type:"button"});
    c.innerHTML = signSVG(s,64,{hideLabel:true})+"<span>"+esc2(s.name)+"</span>";
    c.addEventListener("click",()=>open(s));
    grid.appendChild(c);
  });
  app.appendChild(h("div",{class:"sec"},[grid]));
  if(openId){ const s=SIGNS.find(x=>x.id===openId); if(s) open(s); }
  window.scrollTo(0,0);
}

/* ── recommendation engine ───────────────────────────────────────────── */
function recommend(){
  if(missCount()>=6) return {label:"Clear "+missCount()+" from your Fix-It list", go:reviewView};
  const unseen = SIGNS.length - signsSeen();
  if(unseen > 0) return {label: signsSeen()===0 ? "Start with the signs — Sign Sprint"
                                                : unseen+" signs you have never been shown", go:startSprint};
  const weak = TOPICS.map(t=>({t, v: accuracy(S.topic[t.id])*coverage(S.topic[t.id]), c:coverage(S.topic[t.id])}))
                     .sort((a,b)=>a.v-b.v)[0];
  if(readiness()>=78) return {label:"You are ready — take the mock G1 exam", go:startExam};
  if(weak && weak.v<0.75) return {label:"Weakest area: "+weak.t.name, go:()=>startRapid(weak.t.id)};
  return {label:"Take the mock G1 exam", go:startExam};
}

/* ── HOME ───────────────────────────────────────────────────────────── */
const GAMES = [
 {id:"sprint", sign:"yield",   name:"Sign Sprint",    d:"90 seconds. Name the sign. Build a streak.", go:startSprint},
 {id:"decoder",sign:"schoolAhead", name:"Shape & Colour", d:"Read a sign you have never seen before.", go:startDecoder},
 {id:"rapid",  sign:"maxSpeed", name:"Rapid Fire",    d:"Rules of the road, 12 at a time.", go:()=>topicPicker()},

 {id:"dial",   sign:"maxSafeSpeed", name:"Distance Dial", d:"Every number the G1 loves to ask.", go:startDial},
 {id:"ladder", sign:"routeMarker", name:"Licence Ladder", d:"Chapter 1: climb G1 to full G.", go:startLadder}
];
function topicPicker(){
  stopTimers(); document.onkeydown=null;
  const app=$("#app"); app.innerHTML="";
  app.appendChild(hudBar("Rapid Fire"));
  const p=h("div",{class:"panel"});
  p.innerHTML = "<p style=\"color:var(--ink-2)\">Pick a topic, or take a mixed round from all 268 questions.</p>";
  const all=h("button",{class:"btn go wide",type:"button",text:"Mixed round"});
  all.addEventListener("click",()=>startRapid(null));
  p.appendChild(h("div",{class:"btnrow"},[all]));
  app.appendChild(p);
  const sec=h("div",{class:"sec"}); sec.appendChild(h("h2",{text:"By topic"}));
  const rows=h("div",{class:"rows"});
  TOPICS.forEach(t=>{
    const b=S.topic[t.id], acc=Math.round(accuracy(b)*100), cov=coverage(b);
    const el=h("button",{class:"row",type:"button"});
    el.innerHTML = '<div class="nm">'+esc2(t.name)+"<small>"+esc2(t.chap)+"</small></div>"+
      '<div class="bar '+(cov<0.3?"":(acc>=80?"good":acc>=50?"":"bad"))+'"><i style="width:'+(cov?acc:0)+'%"></i></div>'+
      '<div class="pc num">'+(b&&b.n?acc+"%":"—")+"</div>";

  });
  sec.appendChild(rows); app.appendChild(sec);
  window.scrollTo(0,0);
}

function home(){
  stopTimers(); document.onkeydown=null;
  const app=$("#app"); app.innerHTML="";

  const mark = h("div",{class:"mark"});
  mark.innerHTML = '<div class="g1">Night<em>Drive</em></div>';
  app.appendChild(mark);
  app.appendChild(h("div",{class:"mark",html:'<div class="sub">Ontario G1 &middot; Chapters 1 &amp; 2 &amp; every sign</div>'}));
  app.appendChild(h("div",{class:"realtest",html:
    "<b>The real test</b><span>40 questions &middot; 20 signs + 20 rules &middot; you need <b>16 of 20 in each half</b> &middot; about 30 minutes</span>"}));

  /* readiness */
  const r = readiness(), lv = xpInto(S.xp);
  const g = h("div",{class:"panel"});
  const note = r<20 ? "Play a few rounds and this needle starts moving."
             : r<50 ? "Coming along. Keep hitting your weak topics."
             : r<78 ? "Close. Push the red topics up and try a mock exam."
                    : "You are in test-ready territory. Prove it three times.";
  g.innerHTML = '<div class="gauge">'+gaugeSVG(r)+
    '<div class="read"><div class="pct num">'+r+"%</div><div class=\"lbl\">Exam readiness</div>"+
    '<p class="note">'+note+"</p></div></div>"+
    '<div class="statrow">'+
      '<div class="stat"><b class="num">'+lv.l+"</b><span>Level</span></div>"+
      '<div class="stat"><b class="num">'+dayStreak()+"</b><span>Day streak</span></div>"+
      '<div class="stat"><b class="num">'+missCount()+"</b><span>To fix</span></div>"+
      '<div class="stat"><b class="num">'+signsSeen()+"/"+SIGNS.length+"</b><span>Signs seen</span></div></div>";
  const rec = recommend();
  const rb = h("button",{class:"btn go wide",type:"button",text:rec.label});
  rb.addEventListener("click", rec.go);
  g.appendChild(h("div",{class:"btnrow"},[rb]));
  app.appendChild(g);

  /* games */
  const sec1 = h("div",{class:"sec"});
  sec1.appendChild(h("h2",{text:"Games"}));
  const grid = h("div",{class:"games"});
  GAMES.forEach(gm=>{
    const s = SIGNS.find(x=>x.id===gm.sign);
    const c = h("button",{class:"gcard",type:"button"});
    c.innerHTML = '<span class="ic">'+signSVG(s,38,{hideLabel:true})+"</span><b>"+esc2(gm.name)+"</b><small>"+esc2(gm.d)+"</small>"+
      (S.best[gm.id] ? '<span class="best">Best '+S.best[gm.id]+"</span>" : "");
    c.addEventListener("click", gm.go);
    grid.appendChild(c);
  });
  const ex = h("button",{class:"gcard wide exam",type:"button"});
  const passes = S.exams.filter(e=>e.pass).length;
  ex.innerHTML = '<span class="ic">'+signSVG(SIGNS.find(s=>s.id==="stop"),38,{hideLabel:true})+"</span>"+
    "<b>Mock G1 Exam</b><small>The real shape: 20 signs + 20 rules. You need 16 of 20 in each half.</small>"+
    '<span class="best">'+(S.exams.length ? passes+" passed of "+S.exams.length+(S.exams.length===1?" attempt":" attempts") : "Not attempted yet")+"</span>";
  ex.addEventListener("click", startExam);
  grid.appendChild(ex);
  const rv = h("button",{class:"gcard wide review",type:"button"});
  rv.innerHTML = '<span class="ic">'+signSVG(SIGNS.find(s=>s.id==="constructionAhead"),38,{hideLabel:true})+"</span>"+
    "<b>Fix-It Garage "+(missCount()?'<span class="pill hot">'+missCount()+"</span>":"")+"</b>"+
    "<small>Everything you got wrong, waiting to be cleared. Three correct answers retires an item.</small>";
  rv.addEventListener("click", reviewView);
  grid.appendChild(rv);

  const st = h("button",{class:"gcard",type:"button"});
  st.innerHTML = '<span class="ic">'+signSVG(SIGNS.find(s=>s.id==="destinationDistance"),38,{hideLabel:true})+"</span>"+
    "<b>Pit Stop</b><small>The whole two chapters, in short lines.</small>";
  st.addEventListener("click",()=>studyView());
  grid.appendChild(st);
  const sh = h("button",{class:"gcard",type:"button"});
  sh.innerHTML = '<span class="ic">'+signSVG(SIGNS.find(s=>s.id==="crossbuck"),38,{hideLabel:true})+"</span>"+
    "<b>Sign Shop</b><small>All "+SIGNS.length+" signs, sorted by family.</small>";
  sh.addEventListener("click",()=>signsView());
  grid.appendChild(sh);
  sec1.appendChild(grid); app.appendChild(sec1);

  /* progress */
  const sec2 = h("div",{class:"sec"});
  sec2.appendChild(h("h2",{text:"Where you stand"}));
  const rows = h("div",{class:"rows"});
  const areas = CAT_ORDER.map(c=>({name:SIGN_CATS[c].label+" signs", sub:"Signs", b:S.signcat[c], go:()=>startSprint()}))
    .concat(TOPICS.map(t=>({name:t.name, sub:t.chap, b:S.topic[t.id], go:()=>startRapid(t.id)})));
  areas.sort((a,b)=>(accuracy(a.b)*coverage(a.b))-(accuracy(b.b)*coverage(b.b)));
  areas.forEach(a=>{
    const acc = Math.round(accuracy(a.b)*100), cov = coverage(a.b);
    const el = h("button",{class:"row",type:"button"});
    el.innerHTML = '<div class="nm">'+esc2(a.name)+"<small>"+esc2(a.sub)+(cov<1&&a.b?" &middot; keep going":"")+"</small></div>"+
      '<div class="bar '+(!a.b?"":(acc>=80?"good":acc>=50?"":"bad"))+'"><i style="width:'+(a.b?acc:0)+'%"></i></div>'+
      '<div class="pc num">'+(a.b&&a.b.n?acc+"%":"—")+"</div>";
    el.addEventListener("click", a.go);
    rows.appendChild(el);
  });
  sec2.appendChild(rows); app.appendChild(sec2);

  /* badges */
  const sec3 = h("div",{class:"sec"});
  sec3.appendChild(h("h2",{text:"Badges ("+S.badges.length+" / "+BADGES.length+")"}));
  const bl = h("div",{class:"badges"});
  BADGES.forEach(b=>{
    const got = S.badges.indexOf(b.id)>=0;
    const el = h("div",{class:"bdg"+(got?" got":""),title:b.d});
    el.innerHTML = '<span class="e">'+b.e+"</span><span>"+esc2(got?b.n:b.d)+"</span>";
    bl.appendChild(el);
  });
  sec3.appendChild(bl); app.appendChild(sec3);

  const foot = h("div",{class:"foot"});
  foot.innerHTML = "Built from <b>The Official MTO Driver&rsquo;s Handbook</b> (ISBN 978-1-4868-8628-9), chapters 1 and 2, "+
    "plus the traffic signs, lights and pavement markings the knowledge test also covers. "+
    SIGNS.length+" signs &mdash; every one in the handbook &middot; "+BANK.length+" rules questions &middot; "+
    NUMBERS.length+" distances &middot; "+SCENARIOS.length+" right-of-way puzzles."+
    "<br><br>Study aid only — always confirm the current rules at ontario.ca. Progress is saved on this device only. "+
    '<button id="wipe" style="color:#63728A;text-decoration:underline">Reset my progress</button>';
  app.appendChild(foot);
  const w = foot.querySelector("#wipe");
  if(w) w.addEventListener("click",()=>{
    if(confirm("Erase all your scores, badges and Fix-It list on this device?")){
      S = Object.assign({}, BLANK, {days:[],badges:[],exams:[],best:{},topic:{},signcat:{},sign:{},miss:{}});
      try{ localStorage.removeItem(KEY); }catch(e){}
      home();
    }
  });
  window.scrollTo(0,0);
}

home();
})();
